<script>
    document.getElementById('country-select').addEventListener('change', function () {
        // Remove active class from all options
        var options = this.options;
        for (var i = 0; i < options.length; i++) {
            options[i].classList.remove('active');
        }

        // Add active class to selected option
        this.options[this.selectedIndex].classList.add('active');

        // Redirect to the selected URL
        var url = this.options[this.selectedIndex].getAttribute('data-url');
        if (url) {
            window.location.href = url;
        }
    });
</script>

<script>
    document.getElementById('country-select').addEventListener('change', function () {
        // Get the selected option's URL
        var url = this.options[this.selectedIndex].getAttribute('data-url');

        // Save the selected value to localStorage
        localStorage.setItem('selectedCountry', this.value);

        // Redirect to the selected URL
        if (url) {
            window.location.href = url;
        }
    });

    // On page load, check localStorage for the saved value
    document.addEventListener('DOMContentLoaded', function () {
        var selectedCountry = localStorage.getItem('selectedCountry');
        if (selectedCountry) {
            var selectElement = document.getElementById('country-select');
            selectElement.value = selectedCountry;

            // Add active class to the selected option
            var options = selectElement.options;
            for (var i = 0; i < options.length; i++) {
                if (options[i].value === selectedCountry) {
                    options[i].classList.add('active');
                } else {
                    options[i].classList.remove('active');
                }
            }
        }
    });
</script>

<style>
    /* Style for the active option */
    .dropdown-container select option.active {
        background-color: #FF6700;
        color: white;
    }

    .it-header-up-top .clearfix {
        background-color: #FF6700;
        color: white;
    }
</style>
