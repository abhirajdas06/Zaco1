<script>
    // Define the details for each country
    const countryDetails = {
        // "IN": {
        //     "email": "info@india.com",
        //     "phone": "+91 98765 43210",
        //     "address": "123, India Street, Delhi"
        // },
        "USA": {
            "email": "info@zacocomputer.com",
            "phone": "",
            "address": ""
        },
        "UK": {
            "email": "info@zacocomputer.com",
            "phone": "+44 7785 246 591",
            "address": "124 City Road, London, England, EC1V 2NX."
        },
        "CA": {
            "email": "info@zacocomputer.com",
            "phone": "+1 587 435 3187",
            "address": "135 Lower Sherbourne Street, M5A 1Y4, Toronto, ON."
        }
    };

// Function to update the contact details
function updateContactDetails(country) {
    const details = countryDetails[country];
    if (details) {
        // Update the email details
        document.getElementById('email-text').textContent = details.email;
        document.getElementById('email-link').setAttribute('href', 'mailto:' + details.email);

        // Update or hide the phone details
        if (details.phone) {
            document.getElementById('phone-text').textContent = details.phone;
            document.getElementById('phone-link').setAttribute('href', 'tel:' + details.phone);
            document.getElementById('phone-link').style.display = 'inline';
        } else {
            document.getElementById('phone-link').style.display = 'none';
        }

        // Update or hide the address details
        if (details.address) {
            document.getElementById('address-text').textContent = details.address;
            document.getElementById('address-link').style.display = 'inline';
        } else {
            document.getElementById('address-link').style.display = 'none';
        }
    } else {
        // If no details are found, reset to default (India)
        document.getElementById('email-text').textContent = 'info@india.com';
        document.getElementById('phone-text').textContent = '+91 98765 43210';
        document.getElementById('address-text').textContent = '123, India Street, Delhi';

        document.getElementById('phone-link').style.display = 'inline';
        document.getElementById('address-link').style.display = 'inline';
    }
}

document.getElementById('country-select').addEventListener('change', function () {
    // Get the selected option's URL
    var url = this.options[this.selectedIndex].getAttribute('data-url');

    // Save the selected value to localStorage
    localStorage.setItem('selectedCountry', this.value);

    // Update the contact details
    updateContactDetails(this.value);

    // Redirect to the selected URL
    if (url) {
        window.location.href = url;
    }
});

// On page load, check localStorage for the saved value
document.addEventListener('DOMContentLoaded', function () {
    var selectedCountry = localStorage.getItem('selectedCountry') || 'IN'; // Default to India
    var selectElement = document.getElementById('country-select');
    selectElement.value = selectedCountry;

    // Update the contact details on page load
    updateContactDetails(selectedCountry);
});

</script>
